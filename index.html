<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해양 AI 스캐너: 수중 생태 탐사</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #075e8a; background: linear-gradient(to bottom, #075e8a, #021a30); color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; color: #38bdf8; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        p { font-size: 0.9rem; color: #93c5fd; margin-top: 0; margin-bottom: 20px; }
        
        /* 실시간 질문 및 정보가 표시되는 상단 박스 */
        #mission-box { width: 100%; max-width: 500px; background: rgba(15, 23, 42, 0.8); padding: 15px; border-radius: 12px; border: 2px solid #38bdf8; text-align: center; margin-bottom: 15px; font-weight: bold; color: #fff; font-size: 1.1rem; box-shadow: 0 8px 16px rgba(0,0,0,0.3); backdrop-filter: blur(5px); }
        
        /* 모바일 플렉서블 컨테이너 */
        #canvas-container { position: relative; width: 100%; max-width: 500px; aspect-ratio: 4 / 3; background: #000; border-radius: 16px; overflow: hidden; border: 2px solid #1e3a8a; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <h1>🤿 해양 비전: 수중 탐사 렌즈</h1>
    <p>잠수부나 물고기를 비추고 수중 상태를 확인하세요!</p>
    
    <div id="mission-box">🤖 AI 수중 카메라 구동 중...</div>
    
    <div id="canvas-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="display_canvas"></canvas>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('display_canvas');
        const ctx = canvas.getContext('2d');
        const missionBox = document.getElementById('mission-box');

        let session;
        const modelWidth = 640;
        const modelHeight = 640;

        // ⭐️ 학생들의 커스텀 라벨 설정 (로보플로우 라벨링 순서와 일치해야 함)
        const labels = ["diver", "fish"];

        async function startApp() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();

                missionBox.innerText = "⚡ 수중 AI 인식 모델 최적화 중...";
                // 깃허브에 올린 커스텀 ONNX 파일 로드
                session = await ort.InferenceSession.create('best.onnx', { executionProviders: ['webgl', 'wasm'] });
                
                missionBox.innerText = "🔍 수중 생물이나 잠수부를 비춰주세요!";
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                requestAnimationFrame(processFrame);
            } catch (err) {
                missionBox.innerText = "❌ 카메라 권한을 허용해 주세요.";
                console.error(err);
            }
        }

        async function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const inputTensor = preprocess(video, modelWidth, modelHeight);

                if (inputTensor) {
                    try {
                        const outputs = await session.run({ images: inputTensor });
                        const output = outputs[Object.keys(outputs)[0]]; 
                        postprocess(output.data, output.dims);
                    } catch (e) { console.error(e); }
                }
            }
            requestAnimationFrame(processFrame);
        }

        function preprocess(img, width, height) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = width;
            tempCanvas.height = height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0, width, height);
            const imgData = tempCtx.getImageData(0, 0, width, height);
            const data = imgData.data;
            const r = new Float32Array(width * height), g = new Float32Array(width * height), b = new Float32Array(width * height);
            for (let i = 0; i < data.length / 4; i++) {
                r[i] = data[i * 4] / 255.0;
                g[i] = data[i * 4 + 1] / 255.0;
                b[i] = data[i * 4 + 2] / 255.0;
            }
            const float32Data = new Float32Array(width * height * 3);
            float32Data.set(r, 0); float32Data.set(g, width * height); float32Data.set(b, width * height * 2);
            return new ort.Tensor('float32', float32Data, [1, 3, width, height]);
        }

        function postprocess(data, dims) {
            const numAttributes = dims[1]; 
            const numBoxes = dims[2];      
            let detectedThisFrame = false;

            for (let i = 0; i < numBoxes; i += 12) { 
                let maxScore = 0;
                let classId = -1;

                for (let c = 4; c < numAttributes; c++) {
                    const score = data[c * numBoxes + i];
                    if (score > maxScore) {
                        maxScore = score;
                        classId = c - 4;
                    }
                }

                if (maxScore > 0.50) { 
                    detectedThisFrame = true;
                    const detectedClass = labels[classId];

                    const cx = data[0 * numBoxes + i] / modelWidth * canvas.width;
                    const cy = data[1 * numBoxes + i] / modelHeight * canvas.height;
                    const w = data[2 * numBoxes + i] / modelWidth * canvas.width;
                    const h = data[3 * numBoxes + i] / modelHeight * canvas.height;
                    const x = cx - w / 2; const y = cy - h / 2;

                    // 바운딩 박스 색상을 수중 컨셉에 맞춰 하늘색(#38bdf8)으로 지정
                    ctx.strokeStyle = "#38bdf8";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x, y, w, h);

                    ctx.fillStyle = "#38bdf8";
                    const text = `${detectedClass === 'diver' ? 'Diver' : 'Fish'} ${Math.round(maxScore * 100)}%`;
                    ctx.font = "bold 14px sans-serif";
                    const textWidth = ctx.measureText(text).width;
                    ctx.fillRect(x - 2, y - 22, textWidth + 10, 20);

                    ctx.fillStyle = "#0f172a";
                    ctx.fillText(text, x + 3, y - 7);

                    // 💡 상단 질문 및 미션 다이내믹 변경 (조건문 분기)
                    if (detectedClass === "diver") {
                        missionBox.innerHTML = "🤿 잠수부(Diver) 감지 완료!<br><span style='color:#facc15'>❓ 질문: 잠수부의 안전 수칙 중 '상승 시 호흡을 멈추면 안 되는 이유'는 무엇일까요?</span>";
                    } else if (detectedClass === "fish") {
                        missionBox.innerHTML = "🐟 물고기(Fish) 감지 완료!<br><span style='color:#34d399'>🐳 미션: 발견한 물고기의 지느러미 모양을 관찰하고 종류를 분류해 보세요!</span>";
                    }
                    break; 
                }
            }
            
            if (!detectedThisFrame) {
                missionBox.innerHTML = "🔍 수중 생물이나 잠수부를 카메라에 가까이 대주세요.";
            }
        }

        window.onload = startApp;
    </script>
</body>
</html>
